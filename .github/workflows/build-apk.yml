name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Build debug APK
        run: |
          # Use NoWidget.zip if you uploaded the zip; otherwise use the project files as they are
          if [ -f NoWidget.zip ]; then unzip -q -o NoWidget.zip; fi
          S=$(find . -name settings.gradle.kts | head -n 1)
          [ -n "$S" ] || { echo "Project not found - upload NoWidget.zip to the repo root"; exit 1; }

          # Gradle 8.9 matches the Android Gradle Plugin used by the project
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME"

          cd "$(dirname "$S")"
          "$HOME/gradle-8.9/bin/gradle" assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/no-widget.apk"

      - uses: actions/upload-artifact@v6
        with:
          name: no-widget-apk
          path: no-widget.apk
